<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <title>Diagnostic Supabase</title>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
  body {
   font-family: monospace;
   max-width: 800px;
   margin: 50px auto;
   padding: 20px;
   background: #f5f5f5;
  }
  .test {
   background: white;
   padding: 15px;
   margin: 10px 0;
   border-radius: 8px;
   border-left: 4px solid #ccc;
  }
  .success {
   border-color: #10b981;
   background: #d1fae5;
  }
  .error {
   border-color: #ef4444;
   background: #fee2e2;
  }
  pre {
   background: #000;
   color: #0f0;
   padding: 10px;
   border-radius: 4px;
   overflow-x: auto;
  }
 </style>
</head>
<body>
 <h1>🔍 Diagnostic Supabase</h1>
 <div id="results"></div>

 <script>
  const results = document.getElementById('results');
  
  function addTest(title, success, message) {
   const div = document.createElement('div');
   div.className = 'test ' + (success ? 'success' : 'error');
   div.innerHTML = `<strong>${success ? '✅' : '❌'} ${title}</strong><br>${message}`;
   results.appendChild(div);
  }

  // Test 1: SDK chargé
  setTimeout(() => {
   if (typeof window.supabase !== 'undefined') {
    addTest('SDK Supabase chargé', true, 'window.supabase existe');
   } else {
    addTest('SDK Supabase chargé', false, 'window.supabase est undefined');
    return;
   }

   // Test 2: Création client
   try {
    const SUPABASE_URL = 'https://kvrfqjjbugyngleayxge.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2cmZxampidWd5bmdsZWF5eGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MTc4MjgsImV4cCI6MjA4Njk5MzgyOH0.IagXhJPrAnizYAsUQ4WmBzy94cWx5WTdbSrEA_qj06c';
    
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    if (client) {
     addTest('Création client', true, 'Client Supabase créé avec succès');
    } else {
     addTest('Création client', false, 'Client est null');
     return;
    }

    // Test 3: Méthode .from existe
    if (typeof client.from === 'function') {
     addTest('Méthode .from()', true, 'client.from est une fonction');
    } else {
     addTest('Méthode .from()', false, 'client.from n\'est pas une fonction: ' + typeof client.from);
    }

    // Test 4: Méthode .auth existe
    if (client.auth) {
     addTest('Méthode .auth', true, 'client.auth existe');
    } else {
     addTest('Méthode .auth', false, 'client.auth n\'existe pas');
    }

    // Test 5: Test connexion
    client.auth.getUser().then(({data, error}) => {
     if (error) {
      addTest('Test connexion', true, 'Pas connecté (normal): ' + error.message);
     } else {
      addTest('Test connexion', true, 'Connecté comme: ' + (data.user?.email || 'utilisateur'));
     }
    }).catch(err => {
     addTest('Test connexion', false, 'Erreur: ' + err.message);
    });

    // Afficher l'objet client
    const pre = document.createElement('pre');
    pre.textContent = 'Type de client: ' + typeof client + '\n' +
                      'Propriétés: ' + Object.keys(client).join(', ');
    results.appendChild(pre);

   } catch (error) {
    addTest('Création client', false, error.message);
   }
  }, 500);
 </script>
</body>
</html>
