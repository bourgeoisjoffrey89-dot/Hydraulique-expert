<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Connexion - Expert Hydraulique</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
 <style>
  body {
   background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
   min-height: 100vh;
  }
  
  .glass-card {
   background: rgba(255, 255, 255, 0.95);
   backdrop-filter: blur(10px);
   box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
  }
 </style>
</head>
<body class="flex items-center justify-center p-4">

 <div class="glass-card rounded-2xl p-8 w-full max-w-md">
  
  <!-- Logo et Titre -->
  <div class="text-center mb-8">
   <div class="inline-block p-4 bg-gradient-to-r from-purple-600 to-blue-600 rounded-full mb-4">
    <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
     <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
    </svg>
   </div>
   <h1 class="text-3xl font-bold text-gray-800 mb-2">Expert Hydraulique</h1>
   <p class="text-gray-600">Dimensionnement & Diagnostic Intelligent</p>
  </div>
  
  <!-- Onglets -->
  <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
   <button id="loginTab" onclick="showLogin()" 
    class="flex-1 py-2 px-4 rounded-md font-semibold transition bg-white text-purple-600 shadow">
    Connexion
   </button>
   <button id="signupTab" onclick="showSignup()" 
    class="flex-1 py-2 px-4 rounded-md font-semibold transition text-gray-600 hover:text-gray-800">
    Inscription
   </button>
  </div>
  
  <!-- Formulaire Connexion -->
  <div id="loginForm">
   <form onsubmit="handleLogin(event)">
    <div class="mb-4">
     <label class="block text-gray-700 font-semibold mb-2">Email</label>
     <input type="email" id="loginEmail" required
      class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none transition"
      placeholder="votre@email.com">
    </div>
    
    <div class="mb-6">
     <label class="block text-gray-700 font-semibold mb-2">Mot de passe</label>
     <input type="password" id="loginPassword" required minlength="6"
      class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none transition"
      placeholder="••••••••">
    </div>
    
    <button type="submit"
     class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold rounded-lg hover:shadow-lg transition transform hover:scale-105">
     🔐 Se connecter
    </button>
   </form>
  </div>
  
  <!-- Formulaire Inscription -->
  <div id="signupForm" style="display:none;">
   <form onsubmit="handleSignup(event)">
    <div class="mb-4">
     <label class="block text-gray-700 font-semibold mb-2">Email</label>
     <input type="email" id="signupEmail" required
      class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none transition"
      placeholder="votre@email.com">
    </div>
    
    <div class="mb-4">
     <label class="block text-gray-700 font-semibold mb-2">Mot de passe</label>
     <input type="password" id="signupPassword" required minlength="6"
      class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none transition"
      placeholder="Minimum 6 caractères">
    </div>
    
    <div class="mb-6">
     <label class="block text-gray-700 font-semibold mb-2">Confirmer mot de passe</label>
     <input type="password" id="signupPasswordConfirm" required minlength="6"
      class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none transition"
      placeholder="••••••••">
    </div>
    
    <button type="submit"
     class="w-full py-3 bg-gradient-to-r from-green-600 to-teal-600 text-white font-bold rounded-lg hover:shadow-lg transition transform hover:scale-105">
     ✅ Créer mon compte
    </button>
   </form>
  </div>
  
  <!-- Messages -->
  <div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
  
  <!-- Footer -->
  <div class="mt-6 text-center text-sm text-gray-500">
   <p>🔒 Connexion sécurisée par Supabase</p>
  </div>
  
 </div>

 <script>
  // Configuration Supabase
  const SUPABASE_URL = 'https://kvrfqjjbugyngleayxge.sbClient.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2cmZxampidWd5bmdsZWF5eGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MTc4MjgsImV4cCI6MjA4Njk5MzgyOH0.IagXhJPrAnizYAsUQ4WmBzy94cWx5WTdbSrEA_qj06c';
  
  const sbClient = window.sbClient.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  // Vérifier si déjà connecté
  async function checkAuth() {
   const { data: { user } } = await sbClient.auth.getUser();
   if (user) {
    // Déjà connecté, rediriger vers l'app
    window.location.href = 'dashboard.html';
   }
  }
  
  // Basculer onglets
  function showLogin() {
   document.getElementById('loginForm').style.display = 'block';
   document.getElementById('signupForm').style.display = 'none';
   document.getElementById('loginTab').className = 'flex-1 py-2 px-4 rounded-md font-semibold transition bg-white text-purple-600 shadow';
   document.getElementById('signupTab').className = 'flex-1 py-2 px-4 rounded-md font-semibold transition text-gray-600 hover:text-gray-800';
  }
  
  function showSignup() {
   document.getElementById('loginForm').style.display = 'none';
   document.getElementById('signupForm').style.display = 'block';
   document.getElementById('loginTab').className = 'flex-1 py-2 px-4 rounded-md font-semibold transition text-gray-600 hover:text-gray-800';
   document.getElementById('signupTab').className = 'flex-1 py-2 px-4 rounded-md font-semibold transition bg-white text-green-600 shadow';
  }
  
  // Afficher message
  function showMessage(text, type) {
   const msg = document.getElementById('message');
   msg.textContent = text;
   msg.className = `mt-4 p-4 rounded-lg ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
   msg.classList.remove('hidden');
   
   setTimeout(() => {
    msg.classList.add('hidden');
   }, 5000);
  }
  
  // Connexion
  async function handleLogin(event) {
   event.preventDefault();
   
   const email = document.getElementById('loginEmail').value;
   const password = document.getElementById('loginPassword').value;
   
   try {
    const { data, error } = await sbClient.auth.signInWithPassword({
     email: email,
     password: password
    });
    
    if (error) throw error;
    
    showMessage('✅ Connexion réussie ! Redirection...', 'success');
    
    setTimeout(() => {
     window.location.href = 'dashboard.html';
    }, 1000);
    
   } catch (error) {
    showMessage('❌ Erreur : ' + error.message, 'error');
   }
  }
  
  // Inscription
  async function handleSignup(event) {
   event.preventDefault();
   
   const email = document.getElementById('signupEmail').value;
   const password = document.getElementById('signupPassword').value;
   const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
   
   if (password !== passwordConfirm) {
    showMessage('❌ Les mots de passe ne correspondent pas', 'error');
    return;
   }
   
   try {
    const { data, error } = await sbClient.auth.signUp({
     email: email,
     password: password
    });
    
    if (error) throw error;
    
    showMessage('✅ Inscription réussie ! Vérifiez vos emails puis connectez-vous.', 'success');
    
    // Basculer vers connexion après 3 secondes
    setTimeout(() => {
     showLogin();
    }, 3000);
    
   } catch (error) {
    showMessage('❌ Erreur : ' + error.message, 'error');
   }
  }
  
  // Initialiser
  checkAuth();
 </script>

</body>
</html>
